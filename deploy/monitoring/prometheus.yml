# Prometheus (Apache-2.0) for the single-host Almiras ERP install. Everything stays on the KSA host.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: almiras-ksa

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host (disk, memory, load) and the textfile metrics written by the scheduler (run-job.sh,
  # zatca_deadline_check.py) and the backup scripts.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # OpenBao telemetry (unauthenticated_metrics_access on its listener). A sealed store answers with an error,
  # which shows as "up == 0" for this job and fires OpenBaoSealedOrDown.
  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/openbao-ca.crt
      server_name: openbao
    static_configs:
      - targets: ["openbao:8200"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
