# Almiras ERP client authentication (used with -c hba_file=/almiras/pg_hba.conf, see docker-compose.yml).
# Only named roles, only the application database, only from the Docker networks the server sits on
# ("samenet"), only SCRAM. The superuser "postgres" connects through the container's local socket only
# (docker compose exec db psql -U postgres), never over the network. Everything else is rejected.
#
# TYPE  DATABASE      USER                                         ADDRESS   METHOD
local   all           postgres                                               peer
local   all           all                                                    reject
host    almiras       erp_owner,erp_app,erp_backup,erp_monitor     samenet   scram-sha-256
host    replication   erp_backup                                   samenet   scram-sha-256
host    all           all                                          all       reject
