# Checks and tests on every push and pull request (CLAUDE.md: python -m pytest -q must pass before any merge).
# Two jobs: PostgreSQL 16 (the real database; runs the PostgreSQL-only trigger and locking tests) and SQLite.
# Throwaway databases only: no real data or credentials.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp-ci-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python -m pytest -q

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python -m pytest -q
