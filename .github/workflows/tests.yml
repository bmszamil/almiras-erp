# Checks and tests on every push and pull request (CLAUDE.md: python -m pytest -q must pass before any merge).
# Two jobs: PostgreSQL 16 (the real database; runs the PostgreSQL-only trigger and locking tests) and SQLite.
# Tests run in parallel (pytest-xdist, -n auto); REQUIRE_POSTGRES still counts skips from every worker.
# Throwaway databases only: no real data or credentials. Actions are pinned by commit SHA (tag in the comment).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp-ci-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # conftest.py: fail unless the tests run on PostgreSQL and none is skipped.
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (v5.6.0)
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      # pytest-xdist: one worker per CPU, each with its own test database (pytest-django adds _gw<N>).
      - run: python -m pytest -q -rs -n auto

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (v5.6.0)
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      # pytest-xdist: one worker per CPU, each with its own test database (pytest-django adds _gw<N>).
      - run: python -m pytest -q -rs -n auto
