# Checks the deployment kit (deploy/) on every push and pull request that touches it:
#   lint     shellcheck (preinstalled on the runner), hadolint and yamllint, promtool / amtool on the
#            monitoring config, OpenBao policy rendering
#   compose  docker compose config for every profile, with throwaway placeholder secrets
#   stack    builds both images, starts PostgreSQL 16, runs migrate as the owner role, the release check as
#            the application role (Django deploy checks, no unapplied migration, access R45 / AT-47), a
#            backup, and the restore drill into a throwaway database
# Throwaway values only: every secret, certificate and age key is generated inside the job and discarded.
# No real system, credential or ZATCA endpoint is contacted.
# Actions are pinned by commit SHA (same pins as tests.yml); container images by tag and digest.
name: deploy-check

on:
  push:
    paths: ["deploy/**", ".github/workflows/deploy-check.yml", "requirements.txt", "config/settings.py"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy-check.yml", "requirements.txt", "config/settings.py"]

permissions:
  contents: read

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  PROMETHEUS_IMAGE: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x deploy/bin/*.sh deploy/backup/*.sh deploy/postgres/initdb/*.sh \
            deploy/postgres/bin/*.sh deploy/openbao/*.sh deploy/init-secrets.sh
      - name: hadolint
        run: |
          for f in deploy/Dockerfile deploy/postgres/Dockerfile; do
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$f"
          done
      - name: yamllint
        run: |
          pipx run yamllint==1.38.0 -d '{extends: default, rules: {line-length: {max: 140}, document-start: disable,
            truthy: {check-keys: false}, comments: {min-spaces-from-content: 1}}}' \
            deploy/docker-compose.yml deploy/monitoring/*.yml deploy/monitoring/grafana/provisioning/datasources/*.yml
      - name: promtool and amtool
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" "$PROMETHEUS_IMAGE" \
            check rules /m/alert-rules.yml
          echo placeholder > /tmp/smtp_password
          docker run --rm --entrypoint amtool -v "$PWD/deploy/monitoring:/m:ro" \
            -v /tmp/smtp_password:/run/secrets/smtp_password:ro "$ALERTMANAGER_IMAGE" check-config /m/alertmanager.yml
      - name: OpenBao policies render for a group and several entities
        run: |
          deploy/openbao/render-policies.sh ALM ALM SUB1 SUB2 --out /tmp/policies
          ls /tmp/policies
          if grep -R '\${' /tmp/policies; then echo "unrendered placeholder" >&2; exit 1; fi

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - name: Placeholder site config and secrets (throwaway)
        run: |
          cp deploy/env.example deploy/.env
          deploy/init-secrets.sh
          cd deploy/secrets
          for f in smtp_password backup-recipients.txt tls/erp.crt tls/erp.key openbao-tls/server.crt \
                   openbao-tls/server.key openbao-tls/ca.crt; do echo placeholder > "$f"; done
      - name: docker compose config (all profiles)
        working-directory: deploy
        run: |
          docker compose config --quiet
          docker compose --profile ops --profile drill --profile grafana config --quiet
          docker compose --profile ops --profile drill --profile grafana config --services

  stack:
    runs-on: ubuntu-latest
    needs: [lint, compose]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - name: Build images
        run: |
          docker build -f deploy/Dockerfile -t almiras-erp:local .
          docker build -f deploy/postgres/Dockerfile -t almiras-postgres:16 .
      - name: Throwaway secrets, age key and backup directory
        run: |
          cp deploy/env.example deploy/.env
          echo "ALMIRAS_BACKUP_ROOT=$RUNNER_TEMP/backups" >> deploy/.env
          # CI only: the web UI has no MFA yet, so the release check (web.E001) would refuse the stack (web.md).
          echo "DJANGO_WEB_ALLOW_PASSWORD_ONLY_LOGIN=1" >> deploy/.env
          deploy/init-secrets.sh
          echo ci-only > deploy/secrets/smtp_password
          docker run --rm --entrypoint age-keygen almiras-postgres:16 > "$RUNNER_TEMP/ci.agekey" 2>/dev/null
          grep -o 'age1[0-9a-z]*' "$RUNNER_TEMP/ci.agekey" > deploy/secrets/backup-recipients.txt
          for f in tls/erp.crt tls/erp.key openbao-tls/server.crt openbao-tls/server.key openbao-tls/ca.crt; do
            echo placeholder > "deploy/secrets/$f"
          done
          mkdir -p "$RUNNER_TEMP/backups/wal"
          sudo chown -R 999:999 "$RUNNER_TEMP/backups"
      - name: Start PostgreSQL 16 (UTF8, C.UTF-8, roles from postgres/sql/roles.sql)
        working-directory: deploy
        run: docker compose up --detach --wait --no-build db
      - name: Migrate as the owner role
        working-directory: deploy
        run: docker compose run --rm --no-deps migrate
      - name: Release check as the application role (Django checks, migrations, access R45 / AT-47)
        working-directory: deploy
        run: docker compose run --rm --no-deps web release-check
      - name: First-run data as the application role
        working-directory: deploy
        run: docker compose run --rm --no-deps web manage setup_almiras
      - name: Scheduled commands run as the application role
        working-directory: deploy
        run: |
          for c in zatca_process_queue zatca_daily billing_run hr_refresh_status hr_deliver_assignment_events \
                   hr_document_alerts hr_resignation_deadlines hr_gosi_exclusion_reminders hr_accrue_leave \
                   invoicing_charity_recipient_alerts; do
            docker compose run --rm --no-deps -T web /opt/almiras/bin/run-job.sh "$c" -- python manage.py "$c"
          done
          docker compose run --rm --no-deps -T web python /opt/almiras/bin/zatca_deadline_check.py
      - name: Backup and restore drill
        working-directory: deploy
        run: |
          docker compose run --rm --no-deps -T --entrypoint /almiras/backup/pg-backup.sh backup
          ALMIRAS_BACKUP_DIR="$RUNNER_TEMP/backups" ALMIRAS_RESTORE_IDENTITY="$RUNNER_TEMP/ci.agekey" \
            ./backup/restore-test.sh
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color db || true
      - name: Tear down
        if: always()
        working-directory: deploy
        run: |
          docker compose --profile drill down --volumes --remove-orphans || true
          rm -f "$RUNNER_TEMP/ci.agekey"
